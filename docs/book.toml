[book]
title = "Oxigeon MUD Driver"
authors = ["Oxigeon Contributors"]
language = "en"
src = "src"

[build]
build-dir = "../target/doc/book"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
no-section-label = false
fold.enable = true
fold.level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
