# ─── Workspace ───────────────────────────────────────────────────────────────
#
# `oxigeon-compute` is deliberately *not* a default member. It links LuaJIT
# unconditionally, and cargo unifies features across everything one invocation
# builds — so listing it here would hand `mlua-sys` two Lua versions and stop
# the whole workspace compiling. It is built separately:
#
#   cargo build --release                        # the server
#   cargo build --release -p oxigeon-compute     # the compute worker
#
# The server runs fine without it; a worker binary is only needed when
# `[compute] enabled = true`, which is not the default.
[workspace]
members = ["crates/oxigeon-lua", "crates/oxigeon-compute"]
default-members = [".", "crates/oxigeon-lua"]

[package]
name = "oxigeon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oxigeon"
path = "src/main.rs"

# The development cockpit: telnet + GMCP in one pane, the DAP adapter in another.
# See docs/src/tui.md. Nothing in the server depends on it.
[[bin]]
name = "oxigeon-tui"
path = "src/bin/tui/main.rs"

# ─── Which Lua runs the game thread ──────────────────────────────────────────
#
# mlua enforces exactly one Lua version per crate instance, and LuaJIT and PUC
# Lua export the same C symbols, so two runtimes cannot be linked into one
# binary. The choice is therefore made at build time.
#
#   cargo build                                        # Lua 5.5
#   cargo build --no-default-features --features luajit
#
# **The default is Lua 5.5**, and not for performance: on real command dispatch
# the two are within a few percent of each other either way, because
# `limits.lua_instruction_limit` already calls `jit.off()` at boot (a compiled
# trace dispatches no hooks) and the game thread has been running interpreted
# all along. See docs/src/lua-api/performance.md.
#
# What 5.5 buys is a debug hook that can *yield*. On LuaJIT a breakpoint has
# nowhere to suspend to, so it is implemented by blocking the only Lua thread and
# every player on the server freezes until you continue. On 5.5 the engine parks
# that one command as a coroutine and everyone else keeps playing. Plus integers,
# uncatchable errors and better diagnostics.
#
# The compiler is not given up: it moves to where it was actually worth
# something. `oxigeon-compute` links LuaJIT unconditionally, so the 2.10x it is
# worth on tight arithmetic still applies to the jobs that do tight arithmetic.
[features]
default = ["lua55"]
luajit = ["mlua/luajit", "oxigeon-lua/luajit"]
lua55 = ["mlua/lua55", "oxigeon-lua/lua55"]

# ─── The test harness, published ─────────────────────────────────────────────
#
# `oxigeon::testkit` boots a real `ScriptEngine` over a caller-supplied pair of
# jail roots. Off by default, so a release build compiles none of it; a game
# repository turns it on as a dev-dependency to test its own content:
#
#   oxigeon = { path = "../oxigeon", features = ["testkit"] }
#
# `tempfile` is the only thing the harness needs that the server does not, so it
# is optional and pulled in here rather than carried in every release build.
testkit = ["dep:tempfile"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
# Sink/Stream extension traits for the DAP Framed transport
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# WebSocket listener. Server side only: `handshake` is what `accept_async` needs,
# and dropping the default `connect` feature keeps the client half out of the
# build. TLS is *not* taken from this crate — see the rustls block below.
#
# Telnet, GMCP and the DAP framing are all hand-written in this codebase, and
# this is deliberately not. Those are byte-stream state machines with no
# security-relevant framing; RFC 6455 is client-to-server masking, continuation
# frames, control frames interleaved mid-message, UTF-8 validation and a close
# handshake — several hundred lines of fuzz surface on a public port, against
# about sixty lines of glue. This is the `flate2` decision, not the telnet one.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# TLS, for `wss://` and `telnets://`.
#
# Used directly rather than through tokio-tungstenite's TLS features: the
# handshake finishes before the stream ever reaches tungstenite, so **one
# acceptor serves both transports** and the WebSocket crate keeps its client
# half — and the whole `connect` feature — out of a server build.
#
# `ring` rather than `aws-lc-rs`, which is rustls' own default: aws-lc-rs wants
# cmake and nasm present at build time, and this is built on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"

# Lua scripting, vendored build. Which runtime is a build-time choice — see
# [features] below. mlua permits exactly one Lua version per crate instance.
mlua = { version = "0.11", features = ["vendored"], default-features = false }

# Everything that touches a Lua VM and is also needed by the compute worker: the
# sandbox, the value marshaller, the worker VM, the wire protocol. It builds
# against whichever Lua this crate selected; the worker builds the same code
# against LuaJIT, in its own cargo invocation.
oxigeon-lua = { path = "crates/oxigeon-lua", default-features = false }

# Database (Diesel with both backends compiled in for MultiConnection)
diesel = { version = "2", features = ["sqlite", "r2d2", "chrono"] }
diesel_migrations = { version = "2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Compression (MCCP2)
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }

# Utilities
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
anyhow = "1"
tracing-appender = "0.2.5"

# Terminal UI for the `oxigeon-tui` binary only. crossterm is reached through
# `ratatui::crossterm` rather than depended on directly, so the two cannot skew.
ratatui = "0.30"

# Temporary mudlibs, game roots, databases and log directories for the test
# harness. Optional and enabled by `testkit`; a server build never sees it.
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# The suite in `tests/` is the testkit's first caller, so it turns the feature
# on for itself. A dev-dependency on your own crate is how a feature that only
# tests need gets enabled without leaking into a release build.
oxigeon = { path = ".", features = ["testkit"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# `tests/driver/websocket_relay.rs` drives a real client against the real
# listener, which is the only thing here that needs `connect`. Dev-dependency
# features are not unified into `cargo build`, so a release binary still has no
# client code and no TLS — `cargo tree -e features -p tokio-tungstenite` is the
# check if that is ever in doubt.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "connect"] }
# Self-signed certificates for the TLS tests, generated per run. A checked-in
# fixture certificate would expire, and a suite that starts failing on a date
# nobody chose is worse than one that generates what it needs.
rcgen = "0.13"

# Measures LuaJIT on vs off through the real mudlib. See docs/src/lua-api/performance.md.
[[bench]]
name = "dispatch"
harness = false

# The write-cost numbers behind daemons/cache_d.lua, and what write-behind
# actually buys. See benches/writes.rs.
[[bench]]
name = "writes"
harness = false
