[package]
name = "oxigeon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oxigeon"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Lua scripting (LuaJIT, vendored build)
mlua = { version = "0.10", features = ["luajit", "vendored"] }

# Database (Diesel with both backends compiled in for MultiConnection)
diesel = { version = "2", features = ["sqlite", "r2d2", "chrono"] }
diesel_migrations = { version = "2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Compression (MCCP2)
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }

# Utilities
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
