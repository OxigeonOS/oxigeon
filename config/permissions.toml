# config/permissions.toml — Oxigeon Permission Configuration
#
# Maps efun names and mudlib path prefixes to required permission strings.
# Missing file = all efuns and directories are unrestricted (safe default for dev).
# See docs/src/configuration/permissions-toml.md for full reference.

[efuns]
# ─── Hot-reload ──────────────────────────────────────────────────────────────
reload = "efun.reload"

# ─── File system ─────────────────────────────────────────────────────────────
write_file  = "efun.file.write"
append_file = "efun.file.write"
delete_file = "efun.file.delete"

# ─── Session control ─────────────────────────────────────────────────────────
# Note: disconnecting yourself is always allowed; this gates disconnecting others.
disconnect = "efun.session.disconnect"

# ─── Broadcast ───────────────────────────────────────────────────────────────
broadcast        = "efun.broadcast"        # send to ALL sessions
broadcast_to_perm = "daemon.broadcast"     # send to privileged sessions only

# ─── Lua verification ────────────────────────────────────────────────────────
verify_file = "efun.verify"

# ─── Observability reads ─────────────────────────────────────────────────────
journal_read = "daemon.journal_d.read"
audit_read   = "daemon.audit_d.read"

# ─── Debugging / tracing ─────────────────────────────────────────────────────
# Gated independently of cmds/trace.lua's own `admin` permission, so mudlib code
# cannot enable tracing by calling the efun directly.
trace_set     = "efun.trace"
trace_status  = "efun.trace"
trace_show    = "efun.trace"
trace_timings = "efun.trace"
trace_clear   = "efun.trace"

# ─── Document store ──────────────────────────────────────────────────────────
# Reads and ordinary writes are ungated: the store exists so game code can use
# it freely. Only the call that can destroy a whole collection is gated by
# default. Every db_* efun consults this table, so any of them can be gated by
# adding a line here — e.g. db_put = "efun.db.write".
#
# NOTE: gating does not stop a ticker callback. Engine-internal dispatch runs
# with the driver's own authority, so a daemon can call db_clear on a tick
# whatever this says. That is already true of write_file.
db_clear = "efun.db.clear"

[directories]
# Maps mudlib path prefixes to {read, write} permission requirements.
# Longest-prefix match wins. Omit read or write to leave that op unrestricted.

# Admin tooling — only staff can read or write
"/admin" = { read = "dir.read.admin", write = "dir.write.admin" }

# Server logs — read requires appropriate daemon permission; write open for daemon
"/logs"  = { read = "daemon.journal_d.read" }

# Command files — builders can read; only senior staff can modify
"/cmds"  = { write = "dir.write.cmds" }

# Area content — builders can write; everyone can read
# "/areas" = { write = "dir.write.areas" }
