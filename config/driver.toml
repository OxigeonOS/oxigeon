# ============================================================
# Oxigeon Driver Configuration
# Infrastructure concerns — servers, database, logging.
# ============================================================

[database]
# Backend: "sqlite". "postgresql" parses and has no runtime path —
# see docs/src/configuration.md.
backend = "sqlite"
# SQLite filename, relative to the working directory.
url = "oxigeon.db"
# Connection pool size
pool_size = 5

# ---- Network Servers ----
[servers.telnet]
enabled = true
bind = "0.0.0.0"
port = 4000

# `telnets://` — the same protocol inside TLS, which is what a MUD client means
# by "secure connection". A *second* listener rather than a flag on the one
# above, so existing players keep the plaintext port. 992 is the convention;
# binding it needs privileges on Unix, so 4443 is the usual practical choice.
# [servers.telnet_tls]
# enabled = true
# bind = "0.0.0.0"
# port = 4443
# cert_path = "certs/server.crt"
# key_path = "certs/server.key"
# cert_reload_seconds = 300   # notice a renewal without a restart; 0 = read once

# ---- WebSocket ----
# Plaintext `ws://`. Loopback by default: anything reachable off-host should be
# the TLS listener below, or behind a proxy. The wire format is a JSON envelope,
# not a raw text stream — see docs/src/protocols/websocket.md.
[servers.websocket]
enabled = true
bind = "127.0.0.1"
port = 4001
max_frame_bytes = 65536     # largest client message accepted
ping_interval_secs = 30     # server keepalive; 0 disables
missed_pongs = 3            # unanswered pings tolerated (~90s at 30s)

# `wss://`. Same keys as above plus the certificate. A browser will refuse a
# `ws://` connection from an `https://` page, so a hosted client needs this one.
# [servers.websocket_tls]
# enabled = true
# bind = "0.0.0.0"
# port = 4444
# cert_path = "certs/server.crt"
# key_path = "certs/server.key"
# cert_reload_seconds = 300
# Browser origins allowed to open a socket. Empty (the default) accepts any;
# matched exactly, so scheme and port count. A request with no Origin header —
# anything that is not a browser — is always allowed.
# allowed_origins = ["https://play.example.com"]

# Generating a certificate for local development — a browser will warn once and
# let you continue, and Mudlet has a "verify certificate" toggle:
#
#   mkdir -p certs && openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/server.key -out certs/server.crt -subj "/CN=localhost"
#
# The files are re-read when they change, so `certbot` renewal needs no restart —
# see cert_reload_seconds above. A reverse proxy is still the better answer once
# you want OCSP stapling, SNI across several names, or HTTP on the same port.

# ---- Lua Debug Adapter (VS Code) ----
# Omit this section, or leave enabled = false, to keep the VM exactly as it is
# without the debugger.
#
# WHAT A BREAKPOINT COSTS depends on which Lua this build links.
#
#   LuaJIT (default)  FREEZE-THE-WORLD. A stop halts the entire VM: every player
#                     is frozen until you continue — connections stay alive and
#                     input queues, but no game logic runs. Repeating timers
#                     accumulate and fire as a burst on resume. LuaJIT's hook
#                     API cannot yield, so blocking is the only way to hold
#                     execution. A development tool.
#
#   lua55             Only the stopped player waits, *if you ask for it* — see
#                     stop_the_world below. The hook yields, the engine parks
#                     that one command and keeps serving everyone else, so
#                     timers, regeneration and other players' commands carry on
#                     normally. You can debug a live game.
#
# Both: game time does not pass while something is stopped — `os_time()`
# excludes the frozen interval, so regeneration, cooldowns and effects are where
# you left them. And a stop that Lua cannot suspend blocks on either runtime:
# connect handlers, GMCP and hot reloads (not on a coroutine), and anything
# called by C such as a sort comparator or a gsub replacement (a C frame in the
# way). Player commands and timer ticks — so combat, regeneration and effects —
# are coroutines and suspend on their own.
#
# While a client is attached the hook stays installed, which forces LuaJIT onto
# the interpreter. Detach when you are done.
#
[servers.debug]
enabled = true
bind = "127.0.0.1"        # NEVER expose: grants unauthenticated VM control
port = 4711
auto_continue_secs = 300  # resume if the editor goes silent (0 = never)
# Whether a breakpoint holds the whole VM, or only the dispatch that hit it.
# True is what every debugger does, and all LuaJIT can do.
#
# Set false on a lua55 build to debug a game with people on it: one player's
# command — or one tick — waits, and everyone else keeps playing. Expect a
# *stream* of stops if you break on a line a ticker reaches every round, because
# the ticker keeps ticking; a logpoint is usually what you wanted there instead.
# Changeable while running with `trace freeze on|off`.
stop_the_world = true
trace_capacity = 5000     # `trace show` ring size
timing_capacity = 200     # `trace timings` ring size

[logging]
# Level: "trace", "debug", "info", "warn", "error"
level = "info"
# Log to file (optional, comment out for stdout only)
# file = "logs/oxigeon.log"
